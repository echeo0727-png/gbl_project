<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>100만 원으로 세계여행하기</title>
    <style>
      * { box-sizing: border-box; }

      html, body {
        width: 100%;
        height: 100%;
        margin: 0;
      }

      body {
        display: grid;
        min-height: 100dvh;
        place-items: center;
        background: #e6e6e6;
        overscroll-behavior: none;
      }

      #game {
        width: 100%;
        max-width: 480px;
      }

      canvas {
        display: block;
        margin: 0 auto;
      }
    </style>
  </head>
  <body>
    <main id="game" aria-label="100만 원으로 세계여행하기 게임"></main>

    <script type="module">
      import { createSDK } from 'https://h5sdk.onestore.net/lib/v1.2.0/onestore-h5-sdk.min.js';

      const sdk = createSDK();

      sdk.on('pause', () => window.WorldTravelGame?.pause());
      sdk.on('resume', ({ ringerSilent }) => {
        if (ringerSilent !== undefined) {
          window.WorldTravelGame?.setSoundMuted(ringerSilent);
        }
        window.WorldTravelGame?.resume();
      });

      const initialized = sdk.initializeAsync();
      const gameReady = loadScript('https://cdn.jsdelivr.net/npm/phaser@3/dist/phaser.min.js')
        .then(() => import('./main.js'));

      initialized
        .then(async (info) => {
          if (info.err) {
            await startGame();
            return;
          }

          sdk.setLoadingProgress(0);
          await gameReady;
          window.WorldTravelGame.setSoundMuted(info.ringerSilent === true);
          sdk.setLoadingProgress(100);

          await sdk.startGameAsync();
          await startGame();
        })
        .catch((error) => {
          console.error('SDK boot failed:', error.reason);
          startGame();
        });

      function loadScript(src) {
        return new Promise((resolve, reject) => {
          const script = document.createElement('script');
          script.src = src;
          script.onload = resolve;
          script.onerror = reject;
          document.head.append(script);
        });
      }

      function startGame() {
        return gameReady.then(() => window.WorldTravelGame.start());
      }
    </script>
  </body>
</html>
