<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>100만 원으로 세계여행하기</title>
    <style>
      * { box-sizing: border-box; }

      html, body {
        width: 100%;
        height: 100%;
        margin: 0;
      }

      body {
        display: grid;
        min-height: 100dvh;
        place-items: center;
        background: #e6e6e6;
        overscroll-behavior: none;
      }

      #game {
        width: 100%;
        max-width: 480px;
      }

      canvas {
        display: block;
        margin: 0 auto;
      }
    </style>
  </head>
  <body>
    <main id="game" aria-label="100만 원으로 세계여행하기 게임"></main>

    <script type="module">
      import { createSDK } from 'https://h5sdk.onestore.net/lib/v1.2.0/onestore-h5-sdk.min.js';

      const sdk = createSDK();

      sdk.on('pause', () => window.WorldTravelGame?.pause());
      sdk.on('resume', ({ ringerSilent }) => {
        if (ringerSilent !== undefined) {
          window.WorldTravelGame?.setSoundMuted(ringerSilent);
        }
        window.WorldTravelGame?.resume();
      });

      await loadScript('https://cdn.jsdelivr.net/npm/phaser@3/dist/phaser.min.js');
      await import('./main.js');

      sdk.initializeAsync()
        .then((info) => {
          if (info.err) {
            window.WorldTravelGame.start();
            return;
          }

          window.WorldTravelGame.setSoundMuted(info.ringerSilent === true);
          sdk.setLoadingProgress(0);
          sdk.setLoadingProgress(100);

          return sdk.startGameAsync()
            .then(() => window.WorldTravelGame.start())
            .catch((error) => {
              console.error('startGameAsync failed:', error.reason);
              window.WorldTravelGame.start();
            });
        })
        .catch((error) => {
          console.error('initializeAsync failed:', error.reason);
          window.WorldTravelGame.start();
        });

      function loadScript(src) {
        return new Promise((resolve, reject) => {
          const script = document.createElement('script');
          script.src = src;
          script.onload = resolve;
          script.onerror = reject;
          document.head.append(script);
        });
      }
    </script>
  </body>
</html>
